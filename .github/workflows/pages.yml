name: Deploy to GitHub Pages

# Installability needs HTTPS, so the app has to live somewhere real. Nothing is
# built: the repo root is the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages has to be switched on by hand once, under
      # Settings -> Pages -> Source: GitHub Actions. The action's enablement
      # option cannot do it: creating a Pages site is not something the Actions
      # token is allowed to do ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
